{% extends "blog/base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 40px auto; background: rgba(15,23,42,0.85); padding: 30px; border-radius: 12px; color: #fff;">
    <h2>Reset your password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="background: #2563eb; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Send reset link</button>
    </form>
</div>
{% endblock %}
