<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DjangoBlog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1546708973-b339540b5162?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
        }
        .logo { font-size: 24px; font-weight: bold; color: #818cf8; text-decoration: none; }
        .nav-links a { color: #94a3b8; margin-left: 20px; text-decoration: none; }
        .nav-buttons .btn {
            padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; margin-left: 10px;
        }
        .btn-outline { border: 1px solid #475569; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    </style>
</head>
<body>
    <nav>
        <div style="display: flex; align-items: center; gap: 40px;">
            <a href="/" class="logo">DjangoBlog</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="nav-buttons">
            {% if user.is_authenticated %}
                <a href="#" class="btn btn-outline">New Post</a>
                <span style="font-size: 14px; margin: 0 10px;">Hi, {{ user.username }}!</span>
                <a href="/admin/logout/" class="btn btn-outline">Logout</a>
            {% else %}
                <a href="/admin/login/" class="btn btn-outline">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
