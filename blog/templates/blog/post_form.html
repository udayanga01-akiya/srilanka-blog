{% extends 'blog/base.html' %}

{% block content %}
<div style="max-width: 650px; margin: 40px auto; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 35px; color: #fff;">
    <h2 style="color: #38bdf8; margin-bottom: 25px; text-align: center;"> Create New Post</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="text-align: center; margin-top: 25px;">
            <button type="submit" style="background: #2563eb; color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">Publish Post</button>
            <a href="{% url 'post_list' %}" style="margin-left: 15px; color: #94a3b8; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
